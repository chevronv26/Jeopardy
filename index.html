   if(a[i]!==b[i] && a[i]===b[i+1] && a[i+1]===b[i] && a.slice(0,i)===b.slice(0,i) && a.slice(i+2)===b.slice(i+2))return true;
 }}
 return false;
}
function isPersonClue(f){
 const q=String(f.q||'').toLowerCase();
 return /\b(who|whose|which (?:person|president|author|writer|artist|actor|actress|composer|scientist|leader|explorer|poet|philosopher|inventor|painter|director|musician|singer|architect|emperor|king|queen|general|politician)|name (?:the|this) (?:person|president|author|writer|artist|actor|actress|composer|scientist|leader|explorer|poet|philosopher|inventor|painter|director|musician|singer|architect))\b/.test(q);
}
function isCorrect(f,ans){
 const a=normalize(ans),target=normalize(f.a);
 if(!a)return false;
 if(closeEnough(a,target))return true;
 if(!isPersonClue(f) && !/\b(leader|president|author|writer|artist|actor|actress|composer|scientist|explorer|poet|philosopher|inventor|painter|director|musician|singer|architect|activist|prime minister|independence|founded|painted|wrote|discovered|invented)\b/i.test(String(f.q||'')))return false;
 let name=String(f.a).replace(/^(?:sir|dr|president|saint|st)\.?\s+/i,'').trim();
 let parts=name.split(/\s+/);
 if(parts.length<2)return false;
 const suffixes=new Set(['jr','sr','ii','iii','iv']);
 while(parts.length>1&&suffixes.has(normalize(parts[parts.length-1])))parts.pop();
 let last=parts[parts.length-1];
 const generic=new Set(['city','empire','river','sea','mountains','war','king','queen','great','first','second','third']);
 if(generic.has(last.toLowerCase()))return false;
 let candidates=[last];
 // Common multipart surnames, e.g. da Vinci, van Gogh, de Gaulle.
 if(parts.length>=3&&/^(da|de|del|van|von|le|la)$/i.test(parts[parts.length-2]))candidates.push(parts.slice(-2).join(' '));
 return candidates.some(x=>closeEnough(a,normalize(x)));
}
function nav(v){stop();session=null;view=v;render()}function stop(){if(timer)clearInterval(timer);timer=null}function shell(body){$('#nav').innerHTML=['Home','Practice','Test','Cards','Review','Stats'].map(v=>`<button data-nav="${v}" class="${v===view?'on':''}">${v}</button>`).join('');$('#root').innerHTML=body;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>nav(b.dataset.nav))}
function totals(){let s=Object.values(data.stats);return [s.reduce((n,x)=>n+x.total,0),s.reduce((n,x)=>n+x.right,0)]}
function render(){if(session){question();return}if(view==='Home'){let [n,r]=totals();shell(`<div class="grid" style="margin-top:12px"><div class="stat"><b>${n}</b><span class="muted">Attempts</span></div><div class="stat"><b>${n?Math.round(100*r/n):0}%</b><span class="muted">Accuracy</span></div></div><div class="card"><h2>Choose your training</h2><p class="muted">2,000 study facts currently available. Balanced sessions rotate between broad subjects, but the question repository still needs more non-geography content.</p><button class="primary full" id="adaptive">Start adaptive practice</button><button class="secondary full" style="margin-top:9px" id="test">50-question timed simulation</button></div><div class="card"><b>Study smarter</b><p class="muted">Timed recall, flashcards, category practice, missed-question review and performance tracking.</p></div>`);$('#adaptive').onclick=()=>start('adaptive');$('#test').onclick=()=>start('test')}
if(view==='Practice'){shell(`<div class="card"><h2>Category practice</h2><p class="muted">Choose a subject, or use adaptive practice to work on weak areas.</p><div class="grid">${['All',...cats].map(c=>`<button class="pill" data-cat="${esc(c)}">${esc(c)}<br><span class="muted">${c==='All'?facts.length:facts.filter(f=>f.cat===c).length} distinct facts</span></button>`).join('')}</div></div>`);document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>start('practice',b.dataset.cat))}
if(view==='Test'){shell(`<div class="card"><h2>50-question simulation</h2><p>50 facts sampled across broad subjects as evenly as the current question bank allows, 15 seconds each, typed answers.</p><p class="muted">For a more realistic simulation, answers are revealed at the end rather than after each clue.</p><button class="primary full" id="begin">Begin test</button></div>`);$('#begin').onclick=()=>start('test')}
if(view==='Cards'){let pool=facts.filter(f=>filter==='All'||f.cat===filter);if(flashOrder.length!==pool.length){flashOrder=pool.map((_,i)=>i);if(flashShuffle)flashOrder=shuffle(flashOrder);flash=0}let f=pool[flashOrder[flash%pool.length]];shell(`<div class="row"><h2>Flashcards</h2><span class="muted">${flash%pool.length+1} / ${pool.length}</span></div><select id="filter">${['All',...cats].map(c=>`<option ${c===filter?'selected':''}>${esc(c)}</option>`).join('')}</select><div class="row" style="margin:3px 0 13px"><label class="muted" for="shuffle" style="display:flex;align-items:center;gap:8px"><input id="shuffle" type="checkbox" ${flashShuffle?'checked':''} style="width:18px;height:18px;margin:0"> Randomize flashcards</label><button class="secondary" id="reshuffle" ${!flashShuffle?'disabled':''}>↻ Reshuffle</button></div><div class="clue flash" id="flip" role="button" tabindex="0"><small>${esc(f.cat)}</small><b>${esc(flip?f.a:f.q)}</b><small>Tap to ${flip?'see clue':'reveal answer'}</small></div><div class="row" style="margin-top:12px"><button class="secondary" id="prev">← Previous</button><button class="primary" id="next">Next →</button></div><p class="muted">Choose All to mix categories. Randomize shuffles every card without repeating until the deck is complete.</p>`);$('#filter').onchange=e=>{filter=e.target.value;flashOrder=[];flash=0;flip=false;render()};$('#shuffle').onchange=e=>{flashShuffle=e.target.checked;flashOrder=[];flash=0;flip=false;render()};$('#reshuffle').onclick=()=>{flashOrder=shuffle(pool.map((_,i)=>i));flash=0;flip=false;render()};$('#flip').onclick=()=>{flip=!flip;render()};$('#flip').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip=!flip;render()}};$('#prev').onclick=()=>{flash=(flash-1+pool.length)%pool.length;flip=false;render()};$('#next').onclick=()=>{flash++;if(flash%pool.length===0&&flashShuffle)flashOrder=shuffle(pool.map((_,i)=>i));flip=false;render()}}
if(view==='Review'){let ids=data.missed;let due=ids.filter(i=>!data.review[i]||data.review[i]<=Date.now());shell(`<div class="card"><h2>Missed-question review</h2><p class="muted">${ids.length} facts in your review queue; ${due.length} ready for review. Correct responses schedule the next review for tomorrow, then 3 and 7 days.</p><button class="primary full" id="go" ${!ids.length?'disabled':''}>Review missed facts</button></div><div class="card"><b>Review queue</b>${ids.slice(0,15).map(i=>`<div class="review"><small class="muted">${esc(facts[i].cat)}</small><div>${esc(facts[i].q)}</div></div>`).join('')||'<p class="muted">No missed facts yet.</p>'}</div>`);$('#go').onclick=()=>start('review')}
if(view==='Stats'){let [n,r]=totals();let order=window.categoryStatOrder||'name';let rows=cats.map(c=>{let s=data.stats[c]||{total:0,right:0};let total=facts.filter(f=>f.cat===c).length;let seen=facts.reduce((count,f,i)=>count+(f.cat===c&&Number(data.seen[i]||0)>0?1:0),0);return {c,total,seen,attempts:s.total||0,right:s.right||0,wrong:(s.total||0)-(s.right||0),pct:s.total?Math.round(100*s.right/s.total):0}});rows.sort((a,b)=>order==='accuracy'?a.pct-b.pct:order==='attempts'?b.attempts-a.attempts:order==='remaining'?(b.total-b.seen)-(a.total-a.seen):a.c.localeCompare(b.c));let seenTotal=rows.reduce((t,x)=>t+x.seen,0);shell(`<div class="grid" style="margin-top:12px"><div class="stat"><b>${n}</b><span class="muted">Answer attempts</span></div><div class="stat"><b>${n?Math.round(100*r/n):0}%</b><span class="muted">Overall accuracy</span></div><div class="stat"><b>${seenTotal}</b><span class="muted">Distinct facts practiced</span></div><div class="stat"><b>${facts.length-seenTotal}</b><span class="muted">Facts still to try</span></div></div><div class="card"><div class="row"><h2>Stats by category</h2></div><p class="muted">Accuracy counts all answers, including repeat attempts. Coverage counts distinct facts you've tried.</p><label for="stat-sort" class="muted">Sort categories</label><select id="stat-sort"><option value="name" ${order==='name'?'selected':''}>Category name</option><option value="accuracy" ${order==='accuracy'?'selected':''}>Lowest accuracy first</option><option value="attempts" ${order==='attempts'?'selected':''}>Most attempts first</option><option value="remaining" ${order==='remaining'?'selected':''}>Most untried facts first</option></select>${rows.map(x=>`<div class="review" style="margin:13px 0"><div class="row"><b>${esc(x.c)}</b><b>${x.attempts?x.pct+'%':'Not started'}</b></div><div class="bar" style="margin:8px 0"><div style="width:${x.pct}%"></div></div><div class="row"><small class="muted">${x.right} correct · ${x.wrong} incorrect · ${x.attempts} attempts</small></div><div class="row" style="margin-top:6px"><small class="muted">${x.seen} / ${x.total} distinct facts practiced (${Math.round(100*x.seen/x.total)}%)</small></div><div class="bar" style="margin:6px 0"><div style="width:${Math.round(100*x.seen/x.total)}%;background:#6a8edb"></div></div><button class="secondary" data-practice-cat="${esc(x.c)}" style="margin-top:8px">Practice ${esc(x.c)}</button></div>`).join('')}</div><div class="card"><h2>Recent sessions</h2>${data.history.slice(0,12).map(h=>`<div class="review row"><span>${esc(h.mode)}<br><small class="muted">${new Date(h.date).toLocaleDateString()}</small></span><b>${h.right}/${h.total}</b></div>`).join('')||'<p class="muted">No completed sessions yet.</p>'}</div><div class="card"><p class="muted">Progress is saved in this browser and is not cloud-synced.</p><button class="secondary" id="reset">Reset progress</button></div>`);$('#stat-sort').onchange=e=>{window.categoryStatOrder=e.target.value;render()};document.querySelectorAll('[data-practice-cat]').forEach(b=>b.onclick=()=>start('practice',b.dataset.practiceCat));$('#reset').onclick=()=>{if(confirm('Delete all study progress?')){data={stats:{},missed:[],history:[],review:{},seen:{}};save();render()}}}
}
// Interim balanced session sampler: groups geography subcategories together.
function broadCategory(f){return ['World Geography','World Capitals','World Currencies','Geography'].includes(f.cat)?'Geography':f.cat}
function balancedSample(source,count){
 const groups={};for(const f of source)(groups[broadCategory(f)]??=[]).push(f);
 for(const k of Object.keys(groups))groups[k]=shuffle(groups[k]).sort((a,b)=>(data.seen[facts.indexOf(a)]||0)-(data.seen[facts.indexOf(b)]||0));
 const out=[],keys=shuffle(Object.keys(groups));let cursor=0;
 while(out.length<count&&keys.length){const k=keys[cursor%keys.length];if(groups[k].length)out.push(groups[k].shift());if(!groups[k].length){keys.splice(cursor%keys.length,1);if(!keys.length)break;cursor=cursor%keys.length}else cursor++}
 return out;
}
function start(mode,cat='All'){stop();let pool;if(mode==='test'){pool=balancedSample(facts,50).map(f=>({...f,id:facts.indexOf(f)*5+Math.floor(Math.random()*5)}))}else if(mode==='review'){pool=shuffle(data.missed.filter(i=>!data.review[i]||data.review[i]<=Date.now()).map(i=>({...facts[i],id:i*5})))}else{let source=facts.filter(f=>cat==='All'||f.cat===cat);if(mode==='adaptive'){source=shuffle(source).sort((a,b)=>(data.seen[facts.indexOf(a)]||0)-(data.seen[facts.indexOf(b)]||0)||weight(b)-weight(a));source=balancedSample(source,Math.min(20,source.length))}else source=shuffle(source).sort((a,b)=>(data.seen[facts.indexOf(a)]||0)-(data.seen[facts.indexOf(b)]||0));pool=source.map(f=>({...f,id:facts.indexOf(f)*5+Math.floor(Math.random()*5)}))}if(!pool.length){shell('<div class="card">Nothing due for review yet. Try adaptive practice.</div>');return}session={mode,pool,i:0,results:[],answered:false};question()}
function weight(f){let s=data.stats[f.cat]||{total:0,right:0};return (s.total?1-s.right/s.total:0.5)+(data.missed.includes(facts.indexOf(f))?.7:0)+Math.random()*.25}
function question(){let s=session,f=s.pool[s.i],timed=s.mode==='test';shell(`<div class="row" style="margin:16px 0"><b>${timed?'Timed simulation':s.mode==='adaptive'?'Adaptive practice':s.mode==='review'?'Review':'Category practice'}</b><span class="muted">${s.i+1} / ${s.pool.length}</span></div><div class="bar"><div style="width:${100*s.i/s.pool.length}%"></div></div><div class="row" style="margin:12px 0"><small class="muted">${timed?'15 seconds to answer':'Untimed recall'}</small><b id="clock">${timed?'15s':''}</b></div>${timed?'<div class="bar" style="margin-bottom:12px"><div id="clockbar" style="width:100%"></div></div>':''}<div class="clue"><small>${esc(f.cat)}</small><b>${esc(f.q)}</b></div><form id="form"><input id="answer" autocomplete="off" autocapitalize="sentences" placeholder="Type your answer…" aria-label="Answer"><div class="row"><button class="primary" style="flex:1" type="submit">Submit answer</button><button class="secondary" type="button" id="skip">Skip</button></div></form><div id="feedback" aria-live="polite"></div>`);$('#form').onsubmit=e=>{e.preventDefault();submit(false)};$('#skip').onclick=()=>submit(true);if(timed){let end=Date.now()+15000;timer=setInterval(()=>{let left=Math.max(0,Math.ceil((end-Date.now())/1000));if($('#clock'))$('#clock').textContent=left+'s';if($('#clockbar'))$('#clockbar').style.width=(100*Math.max(0,end-Date.now())/15000)+'%';if(!left){stop();submit(true)}},100)}}
function submit(skip){if(!session||session.answered)return;let f=session.pool[session.i],ans=skip?'':$('#answer').value.trim();if(!skip&&!ans){$('#answer').focus();return}stop();session.answered=true;let ok=isCorrect(f,ans),id=facts.findIndex(x=>x.q===f.q&&x.a===f.a);session.results.push({f,ans,ok});let s=data.stats[f.cat]||{total:0,right:0};s.total++;if(ok)s.right++;data.stats[f.cat]=s;data.seen[id]=(data.seen[id]||0)+1;if(!ok){if(!data.missed.includes(id))data.missed.push(id);data.review[id]=Date.now()}else if(data.missed.includes(id)){let old=data.review[id]||0;let days=old>Date.now()?3:1;data.review[id]=Date.now()+days*86400000}save();$('#answer').disabled=true;$('#form').querySelectorAll('button').forEach(b=>b.disabled=true);$('#feedback').innerHTML=(session.mode==='test'?'':`<div class="result"><b class="${ok?'good':'bad'}">${ok?'✓ Correct':'✕ Not quite'}</b><p>Answer: <b>${esc(f.a)}</b></p></div>`)+`<button class="primary full" id="advance" style="margin-top:12px">${session.i+1===session.pool.length?'See results':'Next question →'}</button>`;$('#advance').onclick=()=>{session.i++;session.answered=false;if(session.i===session.pool.length)finish();else question()}}
function finish(){stop();let s=session,r=s.results.filter(x=>x.ok).length;data.history.unshift({date:new Date().toISOString(),mode:s.mode,total:s.results.length,right:r});data.history=data.history.slice(0,40);save();session=null;shell(`<div class="card" style="text-align:center"><div style="font-size:40px">🏆</div><h2>Session complete</h2><div style="font-size:38px;font-weight:800">${r} / ${s.results.length}</div><p class="muted">${Math.round(100*r/s.results.length)}% correct</p><button class="primary" id="again">Practice again</button><button class="secondary" id="stats">View progress</button></div>${s.mode==='test'?`<div class="card"><h2>Answer review</h2>${s.results.map(x=>`<div class="review"><span class="${x.ok?'good':'bad'}">${x.ok?'✓':'✕'}</span> ${esc(x.f.q)}<br><small class="muted">Your answer: ${esc(x.ans||'—')} · Correct: ${esc(x.f.a)}</small></div>`).join('')}</div>`:''}`);$('#again').onclick=()=>start(s.mode);$('#stats').onclick=()=>nav('Stats')}
render();
</script></body></html>
